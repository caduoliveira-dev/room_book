services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:root@db:5432/room_book
    depends_on:
      - db
    restart: always
  db:
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: room_book
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
